name: Build Dual APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dashboard:
    name: Build Dashboard APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Dashboard
        run: npm run build:dashboard

      - name: Build Dashboard APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Dashboard APK
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-kitchen:
    name: Build Kitchen APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Kitchen
        run: npm run build:kitchen

      - name: Build Kitchen APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Kitchen APK
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
